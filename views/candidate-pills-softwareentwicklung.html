  const useSavedPalette=saved.paletteVersion===paletteVersion;
  const colors={pass:useSavedPalette&&/^#[0-9a-f]{6}$/i.test(saved.pass)?saved.pass:'#c6e6d2',close:useSavedPalette&&/^#[0-9a-f]{6}$/i.test(saved.close)?saved.close:'#e8f5ed'};
  function soften(name){return name.replace('Finanzbuchhaltung','Finanz\u00adbuchhaltung').replace('Debitorenbuchhaltung','Debitoren\u00adbuchhaltung')
    .replace('Reisekostenabrechnung','Reisekosten\u00adabrechnung').replace('Umsatzsteuervoranmeldung','Umsatzsteuer\u00advoranmeldung')
    .replace('Jahresabschlusserstellung','Jahresabschluss\u00aderstellung').replace('Forderungsmanagement','Forderungs\u00admanagement')
    .replace('Gehaltsabrechnung','Gehalts\u00adabrechnung').replace('Rechnungswesen','Rechnungs\u00adwesen').replace('Personalabrechnung','Personal\u00adabrechnung');}
  const meanings={pass:'Passt',close:'Ähnlich',gap:'Fehlt im Profil',extra:'Zusätzlich im Profil'};
  function fireState(id){
    const own=byId.get(id),match=own?current.skills.find(s=>s.profile===id):current.skills.find(s=>s.id===id);
    return own?.fire?(match?.fire?'both':'own'):(match?.fire?'job':'none');
  }
  function fireDescription(id){
    const state=fireState(id);
    return state==='both'?'Beide Seiten als Fire Skill markiert':state==='own'?'Fire Skill nur bei dir: besondere Stärke':state==='job'?'Fire Skill nur im Job: besonders wichtig':'';
  }
  function fireMarker(id){
    const state=fireState(id);if(state==='none')return null;
    const badge=document.createElement('span');badge.className='jp-fire';badge.dataset.fire=state;
    badge.setAttribute('aria-hidden','true');
    const icon=document.createElement('i');icon.className='jp-flame';icon.dataset.lucide='flame';icon.setAttribute('aria-hidden','true');badge.append(icon);
    return badge;
  }
  function makePill(id,name,kind){
    const el=document.createElement(kind==='close'?'div':'button');
    el.className=kind==='close'?'jp-pill':'jp-pill cursor-interaction';el.dataset.skill=id;
    if(kind==='close')el.setAttribute('role','group');else el.type='button';
    el.dataset.kind=kind;
    const row=document.createElement('span');row.className='jp-own-row';
    const label=document.createElement('span');label.className='jp-own-name';label.textContent=soften(name);row.append(label);
    const marker=fireMarker(id);if(marker)row.append(marker);el.append(row);
    el.dataset.fire=fireState(id);
    if(marker)el.setAttribute('data-tooltip',fireDescription(id));
    if(kind==='close'){
      const match=current.skills.find(s=>s.profile===id);
      const jobLabel=document.createElement('span');jobLabel.className='jp-job-inline';
      jobLabel.id='jp-bar-softwareentwicklung-inline-'+id;jobLabel.textContent=soften(match.name);el.append(jobLabel);
    } else el.setAttribute('aria-pressed','false');
    return el;
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{design:'Separate Job-Ansicht im Handyformat 201:437 mit Skill-Pillen und kompakter Match-Leiste; ähnliche Job-Skills dauerhaft sichtbar; Fire Skills ohne Du/Job-Beschriftung: gefüllt = beide, Kontur = einseitig',job:current.name,similarJobSkillsVisible:showSimilar,ownFireSkills:profile.filter(s=>s.fire).map(s=>s.name),jobFireSkills:current.skills.filter(s=>s.fire).map(s=>s.name)},privateContent:{paletteVersion,job:current.id,selected,showSimilar,pass:colors.pass,close:colors.close}})?.catch(()=>{});}
  function applyColors(){app.style.setProperty('--jp-pass',colors.pass);app.style.setProperty('--jp-close',colors.close);}
  function fitPairs(){
    const pills=Array.from(cloud.querySelectorAll('.jp-pill[data-kind="close"]'));
    pills.forEach(el=>{el.classList.remove('is-expanded');el.style.width='';el.querySelector('.jp-job-inline').hidden=true;});
    const widths=pills.map(el=>el.getBoundingClientRect().width);
    pills.forEach((el,i)=>{
      const own=byId.get(el.dataset.skill),match=current.skills.find(s=>s.profile===own.id);
      el.setAttribute('aria-label',`Mein Skill: ${own.name}. Ähnlicher Job-Skill: ${match.name}. `+fireDescription(own.id));
      el.style.width=widths[i]+'px';el.classList.add('is-expanded');el.querySelector('.jp-job-inline').hidden=false;
    });
  }
  function showDetail(){
    root.querySelectorAll('button.jp-pill').forEach(el=>el.setAttribute('aria-pressed','false'));
    detail.replaceChildren();detail.hidden=true;if(!selected)return;
    const own=byId.get(selected),match=own?current.skills.find(s=>s.profile===own.id):current.skills.find(s=>s.id===selected);
    if(!own&&!match){selected=null;return;}
    const kind=match?.kind||'extra';
    if(kind==='close'){selected=null;return;}
    detail.hidden=false;
    const title=document.createElement('div');title.className='jp-detail-title';title.textContent=meanings[kind];detail.append(title);
    const line=document.createElement('div');line.className='jp-detail-line';
    line.textContent=match?.kind==='pass'?`${match.name} · auf beiden Seiten angegeben`:match?`Im Job gesucht: ${match.name}`:`Im Job nicht gesucht: ${own.name}`;
    detail.append(line);
    if(fireDescription(selected)){const fireLine=document.createElement('div');fireLine.className='jp-detail-line';fireLine.textContent=fireDescription(selected);detail.append(fireLine);}
    const pill=cloud.querySelector(`[data-skill="${selected}"]`);pill?.setAttribute('aria-pressed','true');
  }
  function render(announce=false){
    applyColors();root.querySelector('.sm-title').textContent=current.name;root.querySelector('.sm-score').textContent=current.score;root.querySelector('.sm-score').setAttribute('aria-label','Beispielscore '+current.score+' von 1');
    const correspondence=id=>current.skills.find(s=>s.profile===id);
    const ownOrder=['p1','p3','p5','p6','p2','p4','p7','p8','p9','p10'];
    const entries=[
      ...ownOrder.map(id=>({...byId.get(id),kind:correspondence(id)?.kind||'extra'})),
      ...current.skills.filter(s=>s.kind==='gap')
    ];
    cloud.replaceChildren();
    const counts={pass:0,close:0,gap:0,extra:0};
    entries.forEach(s=>{
      const el=makePill(s.id,s.name,s.kind);
      el.setAttribute('aria-label',s.kind==='close'?`Mein Skill: ${s.name}. Ähnlicher Job-Skill: ${correspondence(s.id).name}`:`${s.name}: ${meanings[s.kind]}`);
      if(fireDescription(s.id))el.setAttribute('aria-label',el.getAttribute('aria-label')+'. '+fireDescription(s.id));
      cloud.append(el);counts[s.kind]++;
    });
    for(const kind of ['pass','close','gap'])root.querySelector('[data-count="'+kind+'"]').textContent=String(counts[kind]);
    const coverage=root.querySelector('.sm-coverage');coverage.replaceChildren();
    for(const kind of ['pass','close','gap']){
      for(let i=0;i<counts[kind];i++){const unit=document.createElement('span');unit.className='sm-unit';unit.dataset.status=kind;unit.setAttribute('aria-hidden','true');coverage.append(unit);}
    }
    coverage.setAttribute('aria-label','Zehn Job-Skills: '+counts.pass+' passen, '+counts.close+' ähnlich, '+counts.gap+' fehlen. Zusätzliche Profil-Skills werden nicht mitgezählt.');
    if(globalThis.lucide)lucide.createIcons({attrs:{width:14,height:14}});
    fitPairs();showDetail();
    if(announce)root.querySelector('.jp-announcement').textContent=`${current.name}, Beispiel-Score ${current.score}. Die Reihenfolge deiner zehn Skills bleibt unverändert. Ähnliche Job-Bezeichnungen sind dauerhaft sichtbar.`;
  }
  root.addEventListener('click',event=>{
    const pill=event.target.closest('button[data-skill]');if(pill){selected=selected===pill.dataset.skill?null:pill.dataset.skill;showDetail();save();}
  });
  window.addEventListener('openai:set_globals',event=>{
    const value=event.detail?.globals?.widgetState?.privateContent;if(!value)return;
    selected=value.selected||null;
    if(value.paletteVersion===paletteVersion){if(/^#[0-9a-f]{6}$/i.test(value.pass))colors.pass=value.pass;if(/^#[0-9a-f]{6}$/i.test(value.close))colors.close=value.close;}
    render();
  });
  selected=saved.selected||null;render();
  let lastWidth=app.clientWidth;
  new ResizeObserver(()=>{const width=app.clientWidth;if(Math.abs(width-lastWidth)>.5){lastWidth=width;fitPairs();}}).observe(app);
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{applyColors();save();}});tweak.addColorPicker(colors,'pass',{label:'Passt',reference:'--jp-pass'});tweak.addColorPicker(colors,'close',{label:'Ähnlich',reference:'--jp-close'});}
})();
</script>







</body></html>
