  function icon(name){const el=document.createElement('i');el.dataset.lucide=name;el.setAttribute('aria-hidden','true');return el;}
  function soften(name){return name.replace('Jahresabschlusserstellung','Jahresabschluss\u00aderstellung').replace('Kreditorenbuchhaltung','Kreditoren\u00adbuchhaltung').replace('Umsatzsteuervoranmeldung','Umsatzsteuer\u00advoranmeldung').replace('Gehaltsabrechnung','Gehalts\u00adabrechnung').replace('Monatsabschlusserstellung','Monatsabschluss\u00aderstellung').replace('Forderungsmanagement','Forderungs\u00admanagement').replace('Investitionsrechnungen','Investitions\u00adrechnungen').replace('Profitcenterrechnung','Profitcenter\u00adrechnung');}
  function nameLabel(skill){
    const name=document.createElement('span');name.className='os-name';
    const text=document.createElement('span');text.className='os-name-text';text.textContent=soften(skill.name);name.append(text);
    if(skill.important||skill.strength){

    }
    return name;
  }

    list.append(row);
