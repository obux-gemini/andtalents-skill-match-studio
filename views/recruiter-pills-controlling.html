  const saved=window.openai?.widgetState?.privateContent||{};
  const paletteVersion='green-pair-v1';
  const colors={pass:saved.paletteVersion===paletteVersion&&/^#[0-9a-f]{6}$/i.test(saved.pass)?saved.pass:'#c6e6d2',close:saved.paletteVersion===paletteVersion&&/^#[0-9a-f]{6}$/i.test(saved.close)?saved.close:'#e8f5ed'};
  const meanings={pass:'Passt',close:'Ähnlich',gap:'Im Kandidatenprofil nicht angegeben',extra:'Zusätzlicher Kandidaten-Skill'};
  function soften(name){return name.replace('Finanzbuchhaltung','Finanz\u00adbuchhaltung').replace('Debitorenbuchhaltung','Debitoren\u00adbuchhaltung').replace('Kreditorenbuchhaltung','Kreditoren\u00adbuchhaltung').replace('Reisekostenabrechnung','Reisekosten\u00adabrechnung').replace('Umsatzsteuervoranmeldung','Umsatzsteuer\u00advoranmeldung').replace('Jahresabschlusserstellung','Jahresabschluss\u00aderstellung').replace('Forderungsmanagement','Forderungs\u00admanagement').replace('Gehaltsabrechnung','Gehalts\u00adabrechnung').replace('Rechnungswesen','Rechnungs\u00adwesen');}
  function marker(state){
    if(state==='none')return null;
    const span=document.createElement('span');span.className='jp-fire';span.dataset.fire=state;span.setAttribute('aria-hidden','true');
    const icon=document.createElement('i');icon.dataset.lucide='flame';icon.className='jp-flame';icon.setAttribute('aria-hidden','true');span.append(icon);return span;
  }
  function makePill(skill,extra=false){
    const candidate=extra?skill:byId.get(skill.profile);
    const ownFire=Boolean(candidate?.fire),jobFire=extra?false:Boolean(skill.fire);
    const state=ownFire?(jobFire?'both':'own'):(jobFire?'job':'none');
    const el=document.createElement('div');el.className='jp-pill';el.dataset.kind=extra?'extra':skill.kind;
    el.dataset.skill=skill.id;el.dataset.fire=state;
    const row=document.createElement('span');row.className='jp-own-row';
    const title=document.createElement('span');title.className='jp-own-name';title.textContent=soften(skill.name);row.append(title);
    const fire=marker(state);
    const fireInSecondLine=!extra&&skill.kind==='close'&&state==='own';
    if(fire&&!fireInSecondLine)row.append(fire);el.append(row);
    let label=extra?'Kandidaten-Skill: '+skill.name:'Job-Skill: '+skill.name+'. '+meanings[skill.kind]+'.';
    if(!extra&&skill.kind==='close'){
      el.classList.add('is-expanded');
      const pair=document.createElement('span');pair.className='jp-job-inline';
      const pairName=document.createElement('span');pairName.className='rc-candidate-name';pairName.textContent='Kandidat: '+soften(candidate.name);pair.append(pairName);
      if(fireInSecondLine)pair.append(fire);el.append(pair);
      label+=' Ähnlicher Kandidaten-Skill: '+candidate.name+'.';
    }
    const fireLabel=state==='both'?'Fire Skill auf beiden Seiten':state==='job'?'Wichtiger Job-Skill':state==='own'?'Besondere Stärke im Kandidatenprofil':'';
    if(fireLabel){label+=' '+fireLabel+'.';el.setAttribute('data-tooltip',fireLabel);}
    el.setAttribute('aria-label',label);return el;
  }
  function fitPairs(){
    const pills=[...cloud.querySelectorAll('[data-kind="close"]')];
    pills.forEach(el=>{el.classList.add('is-expanded');el.querySelector('.jp-job-inline').hidden=false;});
  }
  function applyColors(){app.style.setProperty('--jp-pass',colors.pass);app.style.setProperty('--jp-close',colors.close);}
  function render(){
    applyColors();root.querySelector('.sm-meta').textContent=current.name;
    root.querySelector('.sm-score').textContent=current.score;
    root.querySelector('.sm-score').setAttribute('aria-label','Beispielscore '+current.score+' von 1');
    cloud.replaceChildren();extraCloud.replaceChildren();
    const counts={pass:0,close:0,gap:0};
    current.skills.forEach(skill=>{cloud.append(makePill(skill));counts[skill.kind]++;});
    const used=new Set(current.skills.map(s=>s.profile).filter(Boolean));
    const extraOrder=['p1','p3','p5','p6','p2','p4','p7','p8','p9','p10'];
    extraOrder.filter(id=>!used.has(id)).forEach(id=>extraCloud.append(makePill(byId.get(id),true)));
    root.querySelector('.rc-extra-section').hidden=extraCloud.children.length===0;
    for(const kind of ['pass','close','gap']){const label=root.querySelector('[data-count="'+kind+'"]');label.textContent=String(counts[kind]);label.parentElement.hidden=counts[kind]===0;}
    const coverage=root.querySelector('.sm-coverage');coverage.replaceChildren();
    for(const kind of ['pass','close','gap'])for(let i=0;i<counts[kind];i++){const unit=document.createElement('span');unit.className='sm-unit';unit.dataset.status=kind;unit.setAttribute('aria-hidden','true');coverage.append(unit);}
    const countNames={pass:'passen',close:'ähnlich',gap:'fehlen im Profil'};
    coverage.setAttribute('aria-label','Zehn Job-Skills: '+['pass','close','gap'].filter(k=>counts[k]>0).map(k=>counts[k]+' '+countNames[k]).join(', ')+'.');
    const importantOpen=current.skills.filter(s=>s.fire&&s.kind==='gap').length;
    const priority=root.querySelector('.rc-priority');priority.hidden=importantOpen===0;priority.textContent=importantOpen===1?'1 wichtiger Skill fehlt':importantOpen+' wichtige Skills fehlen';
    if(globalThis.lucide)lucide.createIcons({attrs:{width:14,height:14}});
    fitPairs();
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{design:'Recruiter-Perspektive mit Job-Skills zuerst und ähnlichen Kandidaten-Skills dauerhaft sichtbar',job:current.name,candidate:'Alex M. (Beispielprofil)',candidateSkillsVisible:true},privateContent:{paletteVersion,pass:colors.pass,close:colors.close}})?.catch(()=>{});}
  window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.privateContent;if(value?.paletteVersion===paletteVersion){if(/^#[0-9a-f]{6}$/i.test(value.pass))colors.pass=value.pass;if(/^#[0-9a-f]{6}$/i.test(value.close))colors.close=value.close;applyColors();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{applyColors();save();}});tweak.addColorPicker(colors,'pass',{label:'Passt',reference:'--jp-pass'});tweak.addColorPicker(colors,'close',{label:'Ähnlich',reference:'--jp-close'});}
})();
</script>



</body></html>
